services:
  - type: web
    name: peoplecore-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYROLL_URL
        value: https://peoplecore-payroll-6bps.onrender.com
  - type: web
    name: peoplecore-payroll
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/payroll/Dockerfile
    dockerContext: .
    healthCheckPath: /health
  - type: web
    name: peoplecore-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://peoplecore-api-6bps.onrender.com
      - key: NEXT_PUBLIC_PAYROLL_URL
        value: https://peoplecore-payroll-6bps.onrender.com
