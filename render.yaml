databases:
  - name: peoplecore-db
    databaseName: peoplecore
    user: peoplecore
    plan: free
    region: singapore
services:
  - type: web
    name: peoplecore-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: peoplecore-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYROLL_URL
        value: https://peoplecore-payroll-trn3.onrender.com
  - type: web
    name: peoplecore-payroll
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: ./services/payroll
    healthCheckPath: /health
  - type: web
    name: peoplecore-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: ./apps/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://peoplecore-api-trn3.onrender.com
      - key: NEXT_PUBLIC_PAYROLL_URL
        value: https://peoplecore-payroll-trn3.onrender.com
