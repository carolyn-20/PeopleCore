services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peoplecore}
      POSTGRES_USER: ${POSTGRES_USER:-peoplecore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    volumes: ["pgdata:/var/lib/postgresql/data", "./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U peoplecore -d peoplecore"], interval: 5s, timeout: 3s, retries: 15}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://peoplecore:${POSTGRES_PASSWORD:-change_me_local}@db:5432/peoplecore
      JWT_SECRET: ${JWT_SECRET:-local_only_change_this_secret}
      PAYROLL_URL: http://payroll:8000
      REDIS_URL: redis://redis:6379
      PORT: 4000
    ports: ["4000:4000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  payroll:
    build: ./services/payroll
    ports: ["8000:8000"]
  web:
    build: ./apps/web
    environment: {NEXT_PUBLIC_API_URL: http://localhost:4000}
    ports: ["3000:3000"]
    depends_on: [api]
volumes: {pgdata: {}}
